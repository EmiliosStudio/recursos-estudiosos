<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursos estudiosos</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
  :root{--primary:#1a73e8;--hover:#1557b0;--soft:#f8f9fa;--border:#dadce0;--text:#202124;--muted:#5f6368}
  *{box-sizing:border-box;font-family:'Google Sans','Product Sans',Arial,sans-serif}
  body{margin:0;background:#fff;color:var(--text);display:flex;flex-direction:column;min-height:100vh}
  a{color:var(--primary)}
  main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:32px 24px 48px}
  sub,sup{font-size:75%;line-height:0;position:relative;vertical-align:baseline}
  sup{top:-0.5em}
  sub{bottom:-0.25em}

  /* Cabecera */
  .cab{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;padding:6px 24px;min-height:64px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;color:var(--text);text-decoration:none}
  .marca .material-icons-outlined{color:var(--primary);font-size:30px}
  .marca img{height:36px;width:auto}
  #nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  #nav a{padding:8px 14px;border-radius:20px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
  #nav a:hover{background:#f1f3f4;color:var(--text)}
  .buscador{position:relative;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--border);border-radius:24px;padding:0 14px;width:260px;color:var(--muted)}
  .buscador input{border:0;background:transparent;outline:none;padding:10px 0;font-size:14px;width:100%;color:var(--text)}
  #res{position:absolute;top:48px;left:0;right:0;min-width:280px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;overflow:hidden;z-index:30}
  #res a{display:block;padding:10px 14px;text-decoration:none;color:var(--text);font-size:14px}
  #res a small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  #res a:hover{background:#f1f3f4}
  #res .nada{padding:12px 14px;font-size:14px;color:var(--muted)}

  /* Contenido general */
  .aviso{display:flex;gap:10px;align-items:flex-start;background:#e8f0fe;color:#174ea6;border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5;margin-bottom:32px}
  .hero{padding:24px 0 8px}
  .hero h1{font-size:44px;font-weight:500;margin:0 0 20px;line-height:1.15}
  .hero p,.lead{font-size:18px;line-height:1.6;color:var(--muted);margin:0 0 10px}
  h1{font-size:34px;font-weight:500;margin:6px 0 12px}
  h2{font-size:22px;font-weight:500;margin:36px 0 8px}
  .botones{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
  .botones.col{flex-direction:column;align-items:flex-start}
  .boton{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:28px;background:var(--primary);color:#fff;text-decoration:none;font-size:16px;font-weight:500;transition:background .2s;border:1px solid var(--primary)}
  .boton:hover{background:var(--hover)}
  .boton.sec{background:#fff;color:var(--primary);border-color:var(--border)}
  .boton.sec:hover{background:#e8f0fe}
  .boton.off{background:#f1f3f4;color:var(--muted);border-color:var(--border);opacity:.65;cursor:not-allowed}
  .boton small{font-size:12px;font-weight:500}
  .volver{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-weight:500;margin-top:28px}
  .volver:hover{text-decoration:underline}
  .migas{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);margin-bottom:10px}
  .migas a{color:var(--muted);text-decoration:none}.migas a:hover{color:var(--primary);text-decoration:underline}
  .migas .sep{opacity:.6}
  .ctx{font-size:14px;color:var(--muted);margin:0 0 6px}
  .cargando{color:var(--muted)}

  /* Temas y apartados */
  .tema{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;background:#fff}
  .tema summary{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;font-weight:500;font-size:16px;list-style:none}
  .tema summary::-webkit-details-marker{display:none}
  .tema summary .material-icons-outlined{transition:transform .2s;color:var(--muted)}
  .tema[open] summary .material-icons-outlined{transform:rotate(180deg)}
  .aps{list-style:none;margin:0;padding:0 12px 12px}
  .ap{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:15px}
  .ap:hover{background:#e8f0fe;color:var(--primary)}
  .ap.nodisp{opacity:.45;cursor:not-allowed}
  .ap.nodisp:hover{background:transparent;color:var(--text)}
  .etq{font-size:12px;color:var(--muted);white-space:nowrap}

  /* Texto del apartado (modo normal) */
  .contenido{margin-top:20px}
  .contenido p{font-size:17px;line-height:1.7;margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .contenido ul,.contenido ol{font-size:17px;line-height:1.7;margin:0 0 14px;padding-left:26px}
  .contenido li{margin-bottom:6px}
  .contenido h3{font-size:20px;margin:26px 0 10px;white-space:pre-wrap}
  .contenido .figura{text-align:center;margin:18px 0}
  .contenido .figura img{max-width:100%;height:auto;border-radius:6px}
  .enl{margin:18px 0 !important}
  .firma{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;font-size:16px;line-height:1.6}

  /* Hoja con flechas: mismo ancho y tipografía que el PDF para que las flechas queden en su sitio */
  .hoja-wrap{margin-top:20px;width:100%;overflow:hidden}
  .hoja{position:relative;width:663px;padding:20px;background:#fff;border:1px solid var(--border);border-radius:12px;transform-origin:0 0;
    font-size:12pt;line-height:1.5;text-align:left;text-rendering:geometricPrecision;font-kerning:none}
  .hoja p{margin:0 0 8px;font-size:12pt;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
  .hoja h3{font-size:13pt;font-weight:700;margin:14px 0 6px;white-space:pre-wrap}
  .hoja .figura{text-align:center;margin:10px 0}
  .hoja .figura img{max-width:100%;height:auto;display:inline-block}
  .flecha-pdf{position:absolute;z-index:10;transform-origin:0 12px;pointer-events:none}
  .flecha-pdf svg{display:block}

  /* Juegos incrustados */
  .embed{margin:22px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}
  .marco{width:100%;max-height:80vh;background:#f1f3f4}
  .marco iframe{width:100%;height:100%;border:0;display:block}
  .embed figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;font-size:14px;border-top:1px solid var(--border)}
  .acc{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .acc a,.acc button{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--primary);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;padding:0}
  .acc a:hover,.acc button:hover{text-decoration:underline}
  .tarjeta{border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px}
  .tarjeta h3{margin:0 0 8px;font-size:18px;font-weight:500}
  .tarjeta p{margin:0 0 14px;color:var(--muted);line-height:1.6}
  .pdfnota{margin-top:32px;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:14px;color:var(--muted)}
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
  .pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text);max-width:48%;font-size:14px}
  .pager a small{color:var(--muted);font-size:12px}
  .pager a:hover{background:#e8f0fe;border-color:var(--primary)}
  .pager .sig{margin-left:auto;text-align:right}

  /* Página de enlaces de juegos */
  .enlaces h2{margin-top:40px}
  .enlaces h3{font-size:18px;font-weight:500;margin:24px 0 4px}
  .enlaces h4{font-size:15px;font-weight:500;color:var(--muted);margin:16px 0 6px}
  .enlaces ul{margin:0 0 6px;padding-left:22px;line-height:1.8}
  .enlaces ul ul{padding-left:20px}
  .enlaces a{color:var(--primary);text-decoration:underline}
  .enlaces .ap-link{text-decoration:none;font-weight:500;color:var(--text)}
  .enlaces .ap-link:hover{color:var(--primary)}

  /* Pie y aviso emergente */
  footer{border-top:1px solid var(--border);background:var(--soft);padding:22px 24px;font-size:13px;line-height:1.7;color:var(--muted);text-align:center}
  footer a{font-weight:500;text-decoration:none}footer a:hover{text-decoration:underline}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#202124;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%;text-align:center}
  #toast.visible{opacity:1}

  @media (max-width:700px){
    .hero h1{font-size:32px}h1{font-size:28px}
    .buscador{width:100%}.cab{padding:8px 16px}
    main{padding:24px 16px 40px}
    .pager a{max-width:100%}
  }
</style>
</head>
<body>
<header class="cab">
  <a class="marca" href="#/" id="marca"></a>
  <nav id="nav"></nav>
  <div class="buscador">
    <span class="material-icons-outlined">search</span>
    <input id="q" type="search" placeholder="Buscar en el sitio" autocomplete="off" aria-label="Buscar en el sitio">
    <div id="res"></div>
  </div>
</header>

<main id="app"><p class="cargando">Cargando...</p></main>

<footer>
  &copy; Emilio's Studio 2026. Puedes usar la información incluida en esta página web para informarte, dar clase o repasar algún tema, pero no puedes venderlo como si fuera tuyo.
  <a href="#/copyright">Más información.</a>
  <a id="enlaceAuto" href="https://emiliosstudio.github.io/autoapunte/" target="_blank" rel="noopener">AutoApunte</a>.
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Configuración ---------- */
var CONFIG={
  titulo:'Recursos estudiosos',
  logo:'',   // Dirección de una imagen para el logo (opcional)
  autoapunte:'https://emiliosstudio.github.io/autoapunte/',
  pdfsTextos:'https://drive.google.com/drive/folders/1HHflS9hA1-owAjCeHrK1usjFO8tosaZy?usp=drive_link',
  formulario:'https://docs.google.com/forms/d/e/1FAIpQLScn0y708rwlKqs6U55hpnfGPxO_cjWC3dl-tu_XH2vsByONIw/viewform'
};
var HOJA_W=663; // ancho de la hoja con flechas (mismo que el PDF)

var datos={cursos:[]}, extras={enlaces:{},juegos:{},otros:[]}, indice=[], cache={}, pagina=0, obs=null;
var $=function(id){return document.getElementById(id)};
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function urlLimpia(s){
  s=String(s||'').trim();
  var m=s.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
  if(m)s=m[1];
  s=s.replace(/&amp;/g,'&');
  return /^https?:\/\//i.test(s)?s:'';
}
var toastT=null;
function toast(m){
  var t=$('toast');t.textContent=m;t.classList.add('visible');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('visible')},2600);
}

/* ---------- Datos y disponibilidad ---------- */
function normalizar(){
  if(!datos||!Array.isArray(datos.cursos))datos={cursos:[]};
  datos.cursos.forEach(function(c){
    c.asignaturas=c.asignaturas||[];
    c.asignaturas.forEach(function(a){
      a.carpeta=a.carpeta||'';a.temas=a.temas||[];
      a.temas.forEach(function(te,i){te.carpeta=te.carpeta||'tema'+(i+1);te.apartados=te.apartados||[]});
    });
  });
}
function clave(a,te,p){return a.carpeta+'/'+te.carpeta+'/'+p.archivo}
function juegosDe(a,te,p){return extras.juegos[clave(a,te,p)]||[]}
function leerTxt(url){
  if(url in cache)return Promise.resolve(cache[url]);
  return fetch(url,{cache:'no-store'})
    .then(function(r){return r.ok?r.text():''})
    .then(function(t){t=t.trim()?t:null;cache[url]=t;return t})
    .catch(function(){cache[url]=null;return null});
}
function disponible(a,te,p){
  return leerTxt('textos/'+clave(a,te,p)).then(function(x){return !!x||juegosDe(a,te,p).length>0});
}

/* ---------- TXT -> HTML (mismo formato que AutoApunte y el Administrador) ---------- */
function inline(t){
  var h=esc(t);
  h=h.replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/__([\s\S]+?)__/g,'<u>$1</u>');
  h=h.replace(/\^([^\^\n]+?)\^/g,'<sup>$1</sup>');
  h=h.replace(/~([^~\n]+?)~/g,'<sub>$1</sub>');
  return h;
}
function flechaHTML(x,y,ang,tam,color){
  x=parseInt(x,10)||60;
  y=parseInt(y,10)||60;
  ang=parseInt(ang,10)||0;
  tam=Math.max(24,parseInt(tam,10)||70);
  color=color||'#1a73e8';
  return '<div class="flecha-pdf" style="left:'+x+'px;top:'+y+'px;color:'+esc(color)+';transform:rotate('+ang+'deg)">'+
    '<svg width="'+tam+'" height="24" viewBox="0 0 '+tam+' 24">'+
    '<line x1="2" y1="12" x2="'+(tam-10)+'" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>'+
    '<polyline points="'+(tam-16)+',6 '+(tam-6)+',12 '+(tam-16)+',18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    '</svg></div>';
}
function recursoHTML(j){
  var url=urlLimpia(j.url);if(!url)return '';
  var abrir=urlLimpia(j.abrir)||url;
  var tit=j.titulo||'Actividad interactiva';
  if(j.tipo==='enlace'){
    return '<p class="enl"><a class="boton sec" href="'+esc(abrir)+'" target="_blank" rel="noopener">'+esc(tit)+'<span class="material-icons-outlined">open_in_new</span></a></p>';
  }
  var alto=parseInt(j.alto,10)||520;
  return '<figure class="embed"><div class="marco" style="height:'+alto+'px">'+
    '<iframe src="'+esc(url)+'" title="'+esc(tit)+'" loading="lazy" allow="fullscreen; autoplay; clipboard-write; gamepad" allowfullscreen '+
    'sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-modals"></iframe></div>'+
    '<figcaption><span>'+esc(tit)+'</span><span class="acc">'+
    '<button type="button" data-full><span class="material-icons-outlined">fullscreen</span>Pantalla completa</button>'+
    '<a href="'+esc(abrir)+'" target="_blank" rel="noopener"><span class="material-icons-outlined">open_in_new</span>Abrir en otra pestaña</a>'+
    '</span></figcaption></figure>';
}
function parsear(txt){
  var html='';
  txt=txt.replace(/\r\n?/g,'\n').replace(/\s*(\[(?:fotos\/[^\]]+|embed:[^\]]+|flecha:[^\]]+)\])\s*/g,'\n\n$1\n\n');
  txt.split(/\n{2,}/).forEach(function(b){
    var buf=[];
    function vaciar(){if(buf.length){html+='<p>'+buf.map(inline).join('<br>')+'</p>';buf=[]}}
    b.split('\n').forEach(function(l){
      if(!l.trim())return;
      var lt=l.trim();
      var mf=lt.match(/^\[flecha:(-?\d+),(-?\d+),(-?\d+),(\d+)(?:,(#[0-9a-fA-F]{3,6}))?\]$/);
      var f=lt.match(/^\[(fotos\/[^\]]+)\]$/);
      var e=lt.match(/^\[embed:([^\]|]+)(?:\|(\d{2,4}))?\]$/);
      if(mf){vaciar();html+=flechaHTML(mf[1],mf[2],mf[3],mf[4],mf[5])}
      else if(f){vaciar();html+='<div class="figura"><img src="textos/'+esc(f[1])+'" alt="" loading="lazy"></div>'}
      else if(e){vaciar();html+=recursoHTML({url:e[1],alto:e[2]})}
      else if(/^#{2,3}\s+/.test(lt)){vaciar();html+='<h3>'+inline(lt.replace(/^#{2,3}\s+/,''))+'</h3>'}
      else buf.push(l.replace(/[\r\n]+$/g,''));
    });
    vaciar();
  });
  return html;
}

/* ---------- Hoja con flechas: se reduce en bloque si no cabe ---------- */
function ajustarHoja(){
  var w=$('hojaWrap'),h=$('hoja');if(!w||!h)return;
  var disp=w.clientWidth;if(!disp)return;
  var k=Math.min(1,disp/HOJA_W);
  h.style.transform=k<1?'scale('+k+')':'none';
  h.style.marginLeft=k<1?'0':Math.max(0,Math.round((disp-HOJA_W)/2))+'px';
  w.style.height=Math.ceil(h.offsetHeight*k)+'px';
}
window.addEventListener('resize',ajustarHoja);

/* ---------- Piezas de página ---------- */
function migas(l){
  return '<nav class="migas">'+l.map(function(x,i){
    return(x[1]&&i<l.length-1)?'<a href="'+x[1]+'">'+esc(x[0])+'</a>':'<span>'+esc(x[0])+'</span>';
  }).join('<span class="sep">/</span>')+'</nav>';
}
function volver(h,t){return '<a class="volver" href="'+h+'"><span class="material-icons-outlined">arrow_back</span>'+(t||'Volver atrás')+'</a>'}
function titulo(t){document.title=t+' - '+CONFIG.titulo}
function formularioHTML(){
  return recursoHTML({titulo:'Formulario de contacto',url:CONFIG.formulario+'?embedded=true',abrir:CONFIG.formulario,alto:760});
}

/* ---------- Páginas ---------- */
function pInicio(){
  document.title=CONFIG.titulo;
  var botones=datos.cursos.map(function(c,i){return '<a class="boton" href="#/curso/'+i+'">'+esc(c.nombre)+'</a>'}).join('');
  $('app').innerHTML=
    '<div class="aviso"><span class="material-icons-outlined">info</span><span>Muchos de los juegos incrustados en esta página no funcionan bien en dispositivos móviles, salvo los enlaces sueltos. <a href="#/info">Más información.</a></span></div>'+
    '<section class="hero"><h1>'+esc(CONFIG.titulo)+'</h1>'+
    '<p>Descubre un montón de recursos gratuitos de muchas asignaturas, y muchos cursos.</p>'+
    '<p>Materiales, textos y actividades creadas y diseñadas por Emilio\'s Studio.</p>'+
    '<p>Elige tu curso, asignatura y recursos necesarios, y... a estudiar montón!</p>'+
    '<div class="botones">'+botones+'<a class="boton sec" href="#/otros">Otros recursos</a></div></section>';
}
function pCurso(c,ci){
  titulo(c.nombre);
  var asigs=c.asignaturas.map(function(a,ai){return '<a class="boton" href="#/asig/'+ci+'/'+ai+'">'+esc(a.nombre)+'</a>'}).join('');
  var enl=(extras.enlaces[c.nombre]||[]).map(function(e){
    var u=urlLimpia(e.url);if(!u)return '';
    return '<a class="boton sec" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(e.titulo||u)+'<span class="material-icons-outlined">open_in_new</span></a>';
  }).join('');
  $('app').innerHTML=migas([['Inicio','#/'],[c.nombre]])+
    '<h1>'+esc(c.nombre)+'</h1>'+
    '<p class="lead">Bien! Sabiendo que quieres materiales de '+esc(c.nombre)+', elige ahora tu asignatura.</p>'+
    '<div class="botones col">'+asigs+enl+'</div>'+volver('#/');
}
function pAsig(c,ci,a,ai){
  titulo(a.nombre);
  var temas=a.temas.map(function(te,ti){
    var aps=te.apartados.map(function(p,pi){
      return '<li><a class="ap" data-k="'+ti+'.'+pi+'" href="#/ap/'+ci+'/'+ai+'/'+ti+'/'+pi+'"><span>'+esc(p.nombre)+'</span><span class="etq"></span></a></li>';
    }).join('');
    return '<details class="tema"'+(ti===0?' open':'')+'><summary><span>'+esc(te.nombre)+'</span><span class="material-icons-outlined">expand_more</span></summary><ul class="aps">'+aps+'</ul></details>';
  }).join('');
  $('app').innerHTML=migas([['Inicio','#/'],[c.nombre,'#/curso/'+ci],[a.nombre]])+
    '<h1>'+esc(a.nombre)+'</h1><p class="lead">Elige un tema y el apartado que quieres estudiar.</p>'+
    '<div style="margin-top:24px">'+(temas||'<p class="cargando">Todavía no hay temas en esta asignatura.</p>')+'</div>'+volver('#/curso/'+ci);
  var tok=pagina;
  a.temas.forEach(function(te,ti){
    te.apartados.forEach(function(p,pi){
      disponible(a,te,p).then(function(ok){
        if(ok||tok!==pagina)return;
        var el=document.querySelector('a.ap[data-k="'+ti+'.'+pi+'"]');if(!el)return;
        el.classList.add('nodisp');el.removeAttribute('href');
        el.querySelector('.etq').textContent='No disponible';
        el.addEventListener('click',function(e){e.preventDefault();toast('No está disponible: este apartado todavía no tiene contenido.')});
      });
    });
  });
}
async function pAp(c,ci,a,ai,te,ti,ap,pi){
  var tok=pagina;
  $('app').innerHTML='<p class="cargando">Cargando...</p>';
  var txt=await leerTxt('textos/'+clave(a,te,ap));
  var oks=await Promise.all(te.apartados.map(function(x){return disponible(a,te,x)}));
  if(tok!==pagina)return;
  titulo(ap.nombre);
  var juegos=juegosDe(a,te,ap);
  var base='#/asig/'+ci+'/'+ai;
  if(!txt&&!juegos.length){
    $('app').innerHTML=migas([['Inicio','#/'],[c.nombre,'#/curso/'+ci],[a.nombre,base],[te.nombre]])+
      '<h1>'+esc(ap.nombre)+'</h1><p class="lead">No está disponible: este apartado todavía no tiene contenido.</p>'+volver(base);
    return;
  }
  var ant=-1,sig=-1,i;
  for(i=pi-1;i>=0;i--)if(oks[i]){ant=i;break}
  for(i=pi+1;i<te.apartados.length;i++)if(oks[i]){sig=i;break}
  function lnk(idx,cls,et){
    return '<a class="'+cls+'" href="#/ap/'+ci+'/'+ai+'/'+ti+'/'+idx+'"><small>'+et+'</small>'+esc(te.apartados[idx].nombre)+'</a>';
  }
  var conFlechas=!!txt&&/\[flecha:/.test(txt);
  var cuerpo=txt?parsear(txt):'';
  var bloque=conFlechas
    ?'<div class="hoja-wrap" id="hojaWrap"><div class="hoja" id="hoja">'+cuerpo+'</div></div>'
    :'<article class="contenido">'+cuerpo+'</article>';
  $('app').innerHTML=migas([['Inicio','#/'],[c.nombre,'#/curso/'+ci],[a.nombre,base],[te.nombre]])+
    '<h1>'+esc(ap.nombre)+'</h1>'+
    '<p class="ctx">'+esc(c.nombre+' · '+a.nombre+' · '+te.nombre)+'</p>'+
    bloque+
    (juegos.length?'<section><h2>Juegos y actividades</h2>'+juegos.map(recursoHTML).join('')+'</section>':'')+
    '<div class="pdfnota">¿Quieres este apartado en PDF? Crea el tuyo con <a href="'+esc(CONFIG.autoapunte)+'" target="_blank" rel="noopener">AutoApunte</a>.</div>'+
    '<div class="pager">'+(ant>=0?lnk(ant,'ant','Anterior'):'<span></span>')+(sig>=0?lnk(sig,'sig','Siguiente'):'')+'</div>'+
    volver(base);
  if(conFlechas){
    var h=$('hoja');
    if(window.ResizeObserver){obs=new ResizeObserver(ajustarHoja);obs.observe(h)}
    ajustarHoja();
  }
}

/* ---------- Enrutador ---------- */
function pintar(){
  pagina++;
  if(obs){obs.disconnect();obs=null}
  $('res').style.display='none';
  window.scrollTo(0,0);
  var p=location.hash.replace(/^#\/?/,'').split('/').map(function(x){try{return decodeURIComponent(x)}catch(e){return x}});
  var r=p[0]||'inicio';
  var c=datos.cursos[p[1]],a=c&&c.asignaturas[p[2]],te=a&&a.temas[p[3]],ap=te&&te.apartados[p[4]];
  if(r==='curso'&&c)return pCurso(c,p[1]);
  if(r==='asig'&&a)return pAsig(c,p[1],a,p[2]);
  if(r==='ap'&&ap)return pAp(c,p[1],a,p[2],te,p[3],ap,parseInt(p[4],10));
  if(r==='otros')return pOtros();
  if(r==='enlaces')return pEnlaces();
  if(r==='contacto')return pContacto();
  if(r==='creditos')return pCreditos();
  if(r==='info')return pInfo();
  if(r==='copyright')return pCopyright();
  pInicio();
}

/* ---------- Cabecera, navegación y buscador ---------- */
function construir(){
  $('marca').innerHTML=(CONFIG.logo?'<img src="'+esc(CONFIG.logo)+'" alt="">':'<span class="material-icons-outlined">school</span>')+'<span>'+esc(CONFIG.titulo)+'</span>';
  $('nav').innerHTML=datos.cursos.map(function(c,i){return '<a href="#/curso/'+i+'">'+esc(c.nombre)+'</a>'}).join('')+'<a href="#/otros">Otros recursos</a>';
  $('enlaceAuto').href=CONFIG.autoapunte;
  indice=[];
  datos.cursos.forEach(function(c,ci){c.asignaturas.forEach(function(a,ai){a.temas.forEach(function(te,ti){te.apartados.forEach(function(p,pi){
    indice.push({n:norm(c.nombre+' '+a.nombre+' '+te.nombre+' '+p.nombre),t:p.nombre,ctx:c.nombre+' · '+a.nombre+' · '+te.nombre,h:'#/ap/'+ci+'/'+ai+'/'+ti+'/'+pi});
  })})})});
}
$('q').addEventListener('input',function(){
  var q=norm(this.value).trim(),res=$('res');
  if(!q){res.style.display='none';return}
  var terminos=q.split(/\s+/);
  var hits=indice.filter(function(x){return terminos.every(function(t){return x.n.indexOf(t)>-1})}).slice(0,8);
  res.innerHTML=hits.length?hits.map(function(h){return '<a href="'+h.h+'">'+esc(h.t)+'<small>'+esc(h.ctx)+'</small></a>'}).join(''):'<div class="nada">Sin resultados</div>';
  res.style.display='block';
});
$('q').addEventListener('keydown',function(e){
  if(e.key==='Enter'){var a=$('res').querySelector('a');if(a)location.hash=a.getAttribute('href')}
  if(e.key==='Escape'){$('res').style.display='none'}
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.buscador'))$('res').style.display='none';
  var b=e.target.closest('[data-full]');
  if(b){var f=b.closest('figure').querySelector('iframe');if(f&&f.requestFullscreen)f.requestFullscreen()}
});

/* ---------- Inicio ---------- */
Promise.all([
  fetch('datos.json',{cache:'no-store'}).then(function(r){return r.json()}),
  fetch('extras.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}})
]).then(function(r){
  datos=r[0];normalizar();
  var x=r[1]||{};
  extras={enlaces:x.enlaces||{},juegos:x.juegos||{},otros:x.otros||[]};
  construir();pintar();
  window.addEventListener('hashchange',pintar);
}).catch(function(){
  $('app').innerHTML='<div class="aviso"><span class="material-icons-outlined">error_outline</span><span>No se ha podido cargar datos.json. Abre la página desde GitHub Pages o un servidor local, no con doble clic.</span></div>';
});
})();
